<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FitTrack — Plan workouts, log sets, track progress, and crush your personal records." />
    <meta name="theme-color" content="#09090B" />
    <title>FitTrack</title>
  </head>
  <body>
    <script>
      // Apply saved theme before first paint to prevent flash
      (function(){var t=localStorage.getItem('fittrack-theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');document.querySelector('meta[name="theme-color"]').content='#F5F5F7';}})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
